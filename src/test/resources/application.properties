# Test-scope configuration.
#
# READ THIS BEFORE EDITING: src/test/resources precedes src/main/resources on
# the test classpath, and Boot loads the FIRST classpath:/application.properties
# it finds. This file REPLACES the packaged one; it does not merge with it.
# Anything the tests need must be restated here.

spring.application.name=authservice

# Port 0, so a test run does not collide with the same service already running
# locally or under docker compose.
server.port=0

# The config server is not running during a build, and a test that silently
# picks up whatever a developer's local config-server happens to be serving is
# not a test. enabled=false also short-circuits
# ConfigServerConfigDataMissingEnvironmentPostProcessor, which would otherwise
# fail the context because spring-cloud-starter-config is on the classpath with
# no configserver: import declared. import-check is belt and braces.
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# No registration attempt, and no retry loop per test JVM.
eureka.client.enabled=false

# An in-memory datasource, so DataSourceAutoConfiguration has something to bind
# once the @SpringBootApplication exclusion is gone. MODE=PostgreSQL is an
# approximation; the tripwire for moving this module to Testcontainers is the
# first real @Entity plus the first migration.
spring.datasource.url=jdbc:h2:mem:authservice;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
